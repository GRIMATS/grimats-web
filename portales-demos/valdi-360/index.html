          order.meta.cancelReason = note;
          order.meta.cancelledAt = now();

          if (current.balanceCents <= 0) fail('NO_BALANCE', 'Esta cuenta no tiene saldo pendiente.');
          if (mode === 'full' && !current.ready) fail('SERVICES_PENDING', 'Todavía hay servicios pendientes. Márcalos listos o registra un abono.');
          if (mode === 'full' && input.amountCents < current.balanceCents) fail('INSUFFICIENT_PAYMENT', 'El monto recibido no cubre el saldo. Corrígelo o elige abono.');
          if (input.method !== 'cash' && input.amountCents > current.balanceCents) fail('OVERPAYMENT', 'El monto no puede superar el saldo pendiente.');

        });
      },
      getBillingPayload: function (accountId) {

    { id: 'repuestos', name: 'Repuestos', subtitle: 'Piezas para tu vehículo', action: 'Vender una pieza' },

    { id: 'taller', name: 'Taller', subtitle: 'Revisión y reparación', action: 'Recibir trabajo' },
    { id: 'grua', name: 'Grúa', subtitle: 'Recogida y traslado', action: 'Pedir una grúa' }
  ];
  const serviceNames = Object.fromEntries(services.map(function (service) { return [service.id, service.name]; }));
  const statusNames = {
    carwash: { waiting: 'En espera', washing: 'Lavando', ready: 'Listo' },
    repuestos: { pending: 'Por entregar', ready: 'Entregado' },
    bar: { pending: 'Por preparar', preparing: 'Preparando', ready: 'Servido' },
    taller: { approval: 'Por aprobar', working: 'En reparación', ready: 'Listo' },
    grua: { pending: 'Por salir', dispatched: 'En camino', loaded: 'Trasladando', ready: 'Entregado' }
  };
  const statuses = new Set(['waiting', 'washing', 'ready', 'pending', 'preparing', 'approval', 'working', 'dispatched', 'loaded', 'cancelled']);

  function render(state, ui) {
    const H = global.ValdiUI;
    const esc = H.esc;
    const money = H.money;
    const icon = H.icon;
    const accounts = state.accounts || [];
    const orders = state.orders || [];

      const account = accountMap.get(order.accountId);

    });
    const readyAccounts = openAccounts.map(function (account) { return H.summary(account.id); })
      .filter(function (accountSummary) { return accountSummary.canPay; })

    const collectedToday = payments.filter(function (payment) { return H.today(payment.createdAt); })
      .reduce(function (total, payment) { return total + payment.amountCents; }, 0);

      weekday: 'long', day: 'numeric', month: 'long', timeZone: 'America/Santo_Domingo'
    }).format(new Date());

        '<div class="stat-icon">' + icon(glyph) + '</div>' +
        '<div class="grow"><div class="stat-label">' + esc(label) + '</div>' +
        '<div class="stat-value">' + esc(value) + '</div>' +
        '<div class="stat-foot">' + esc(hint) + '</div></div></div>';

      const count = activeOrders.filter(function (order) { return order.module === service.id; }).length;

      '<button type="button" class="btn soft" data-action="new-account">' + icon('plus') + 'Abrir cuenta</button></div>';

      'Una sola cuenta para todos los servicios.';

      '<div class="page-heading"><div><div class="eyebrow">Salcedo · ' + esc(dateText) + '</div>' +
      '<h1 id="home-title">¿Qué vamos a hacer?</h1><p>Elige un servicio. Nosotros llevamos la cuenta.</p></div>' +
      '<button type="button" class="btn primary" data-action="new-account">' + icon('plus') + 'Abrir cuenta</button></div>' +
      '<div class="stats-grid">' +
      stat('Cobrado hoy', money(collectedToday), 'Pagos y abonos de hoy', 'wallet', 'stat-money') +
      stat('Trabajos en curso', activeOrders.length, 'Pendientes o en atención', 'clock') +

      stat('Cuentas abiertas', openAccounts.length, 'Un cliente, una cuenta', 'users') + '</div>' +
      '<div class="section-head"><div><h2>Un lugar, cinco servicios</h2><p>Todo conectado a una misma cuenta.</p></div></div>' +
      '<div class="service-grid">' + services.map(serviceTile).join('') + '</div>' +

      '<div><h2 id="activity-title">Así va el negocio</h2><p>Lo que estamos atendiendo ahora.</p></div>' +

  function parseMoney(value){
    const raw=String(value||'').trim();
    if(!/^\d+(?:[.,]\d{1,2})?$/.test(raw)) throw new Error('Escribe un monto válido, con hasta dos decimales y sin separadores de miles.');
    const [whole,dec='']=raw.replace(',','.').split('.');
    const cents=Number(whole)*100+Number(dec.padEnd(2,'0'));
    if(!Number.isSafeInteger(cents)||cents<=0||cents>100000000)throw new Error('Escribe un monto mayor que cero y revisa la cantidad.');
    return cents;
  }
  function beginPayment(id,mode='full'){
    const s=summary(id);
    if(s.balanceCents<=0){toast('Esta cuenta no tiene saldo pendiente.',true);return;}
    if(mode==='full'&&!s.canPay){toast('Completa los servicios o registra un abono.',true);openModal({type:'account',id});return;}
    openModal({type:'payment',id,mode,method:'cash',amount:'',reference:'',step:1,key:uid('payment'),error:''});
  }
  function paymentChangeHtml(m){
    const s=summary(m.id); let cents=0;try{cents=parseMoney(m.amount);}catch(e){}
    if(!cents) return '<div class="change-box"><span>'+(m.mode==='deposit'?'Abono a registrar':'Cambio a devolver')+'</span><strong>—</strong></div>';
    if(m.mode==='full'&&cents<s.balanceCents) return '<div class="change-box short"><span>Faltan para completar</span><strong>'+money(s.balanceCents-cents)+'</strong></div>';
    const extra=m.method==='cash'?Math.max(0,cents-s.balanceCents):0;
    return '<div class="change-box"><span>'+ (extra||m.mode==='full'?'Cambio a devolver':'Abono a registrar')+'</span><strong>'+money(extra||m.mode==='full'?extra:Math.min(cents,s.balanceCents))+'</strong></div>';
  }

  function receiptMarkup(p){

    else if(m.type==='reset')html=modalFrame('Reiniciar la demostración','Volver a los clientes y pedidos de ejemplo','<p class="form-intro">Se borrarán los pedidos y pagos que hiciste en esta demo, en este navegador. Descarga los datos primero si quieres conservarlos.</p>'+action('Descargar antes de reiniciar','export-data','','secondary full','download')+'<div class="form-grid section-gap">'+inputField('Escribe REINICIAR para confirmar','value',m.value,{full:true,max:20,placeholder:'REINICIAR'})+'</div>'+errorHtml(m.error),action('Conservar mis datos','close-modal','','secondary')+action('Reiniciar demo','confirm-reset','','danger','refresh'),{size:'narrow'});
    else if(m.type==='services')html=modalFrame('¿Qué vamos a hacer?','Selecciona un servicio','<div class="add-service-strip service-picker">'+moduleKeys.map(k=>'<button data-action="service-nav" data-page="'+k+'">'+I(k,32)+E(D.MODULES[k].name)+'</button>').join('')+'</div>',action('Volver al inicio','service-nav','data-page="home"','secondary full','home'),{size:'narrow'});

  function validateCustomer(m){
    if(m.accountMode==='existing'){
      if(!m.accountId||!account(m.accountId))throw new Error('Selecciona una cuenta para continuar.');
      if(account(m.accountId).status!=='open')throw new Error('Esta cuenta ya fue pagada. Abre otra cuenta.');
      return;
    }
    if(!String(m.customer.name||'').trim())throw new Error('Escribe el nombre del cliente para identificar su cuenta.');
    if(['carwash','taller'].includes(m.module)&&!String(m.customer.plate||'').trim()&&!String(m.customer.vehicle||'').trim())throw new Error('Escribe la placa o una descripción del vehículo para reconocerlo.');
    const plate=clean(m.customer.plate).replace(/\s+/g,'');
    const duplicate=plate?state().accounts.find(a=>a.status==='open'&&clean(a.plate).replace(/\s+/g,'')===plate):null;
    if(duplicate)throw new Error('Este vehículo ya tiene una cuenta: '+duplicate.name+' ('+duplicate.code+'). Elige “Ya tiene cuenta” para reunir sus servicios.');
  }
  function validateProducts(m){
    if(!selectedLines(m).length)throw new Error('Agrega al menos un producto o servicio con el botón +.');
    const c=chosenCustomer(m)||{};
    if(['carwash','taller'].includes(m.module)&&!(m.meta.plate||c.plate||'').trim()&&!(m.meta.vehicle||c.vehicle||'').trim())throw new Error('Escribe la placa o una descripción del vehículo.');
    if(m.module==='repuestos'&&!m.meta.compatibilityConfirmed)throw new Error('Confirma que revisaste que las piezas le sirven al vehículo.');
    if(m.module==='taller'&&!m.meta.issue.trim())throw new Error('Describe qué necesita el vehículo antes de continuar.');
    if(m.module==='grua'){
      const selected=selectedLines(m);
      if(selected.some(p=>p.id==='tow-mileage')&&!selected.some(p=>p.module==='grua'&&p.id!=='tow-mileage'))throw new Error('Los kilómetros adicionales se suman a un traslado. Agrega primero el servicio de grúa.');
      if(!m.meta.pickup.trim())throw new Error('Indica el punto de recogida y una referencia.');
      if(!m.meta.destination.trim())throw new Error('Indica dónde se entregará el vehículo.');
      const digits=String(m.meta.phone||c.phone||'').replace(/\D/g,'');
      if(digits.length<7||digits.length>15)throw new Error('Escribe un teléfono de contacto válido para la grúa.');
    }
    for(const p of selectedLines(m)){if(p.stock!==null&&p.quantity>p.stock)throw new Error('Solo quedan '+p.stock+' de '+p.name+'. Ajusta la cantidad.');}
  }
  function validatePayment(m){
    const s=summary(m.id),cents=parseMoney(m.amount);
    if(s.balanceCents<=0)throw new Error('Esta cuenta ya no tiene saldo pendiente.');
    if(m.mode==='full'&&!s.canPay)throw new Error('Termina todos los servicios para cobrar la cuenta completa.');
    if(m.mode==='full'&&cents<s.balanceCents)throw new Error('Faltan '+money(s.balanceCents-cents)+'. Corrige el monto o vuelve a la cuenta para registrar un abono.');
    if(m.method!=='cash'&&cents>s.balanceCents)throw new Error('El monto no puede superar el saldo de la cuenta.');
    if(m.method!=='cash'&&!m.reference.trim())throw new Error('Escribe la referencia del pago antes de continuar.');
  }
  function downloadData(data,filename){

    a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();window.setTimeout(()=>URL.revokeObjectURL(url),2000);
    toast('Se descargó el detalle de la demostración.');
  }

  const advanceTimes=new Map();
  function handleAction(button){
    const d=button.dataset,a=d.action;
    if(a==='nav'){navigate(d.page);return;}
    if(a==='menu'){ui.menu=!ui.menu;renderApp();return;}
    if(a==='menu-close'){ui.menu=false;renderApp();return;}
    if(a==='services'){openModal({type:'services'});return;}
    if(a==='service-nav'){closeModal();navigate(d.page);return;}
    if(a==='help'){openModal({type:'help'});return;}
    if(a==='close-modal'){requestClose();return;}
    if(a==='new-account'){openModal({type:'new-account',customer:{name:'',phone:'',plate:'',vehicle:''},error:''});return;}
    if(a==='save-account'){
      validateCustomer({...modal,accountMode:'new'});
      const created=store.createAccount(modal.customer);onMutation('valdi:account.created',created);openModal({type:'account',id:created.id});toast('Cuenta abierta. Agrega su primer servicio.');return;
    }
    if(a==='account'){openModal({type:'account',id:d.id});return;}
    if(a==='new-order'){newWizard(d.module,d.accountId||'',d.catalogId||'');return;}
    if(a==='module-tab'){ui.moduleTab=d.tab;ui.filter='';renderApp();return;}
    if(a==='cash-tab'){ui.cashTab=d.tab;ui.filter='';renderApp();return;}
    if(a==='inventory-tab'){ui.inventoryTab=d.tab;ui.filter='';renderApp();return;}
    if(a==='ambience'){
      ui.ambience=d.value;renderApp();toast('Preferencia de ambiente actualizada para esta sesión.');return;
    }
    if(a==='bar-table'){
      if(d.accountId)openModal({type:'account',id:d.accountId});else newWizard('bar','','',d.table||'Mostrador');return;
    }
    if(a==='account-mode'){modal.accountMode=d.value;syncCustomer(modal);modal.error='';drawModal(true);return;}
    if(a==='choose-account'){
      modal.accountId=d.id;modal.error='';syncCustomer(modal);drawModal();return;
    }
    if(a==='wizard-step'){modal.step=Number(d.step);modal.error='';drawModal(true);return;}
    if(a==='wizard-back'){modal.step=Math.max(1,modal.step-1);modal.error='';drawModal(true);return;}
    if(a==='wizard-next'){
      if(modal.step===1){validateCustomer(modal);syncCustomer(modal);}else validateProducts(modal);
      modal.step++;modal.error='';drawModal(true);return;
    }
    if(a==='quantity'){
      const p=state().catalog.find(x=>x.id===d.id),delta=Number(d.delta),current=modal.items[p.id]||0;
      const max=['carwash','grua','taller'].includes(p.module)&&p.id!=='tow-mileage'?1:Math.min(p.stock??99,99);
      if(delta>0&&current>=max){toast(max===1?'Este servicio ya está agregado.': 'No hay más unidades disponibles.',true);return;}
      if(delta>0&&p.module==='grua'&&p.id!=='tow-mileage')Object.keys(modal.items).filter(k=>k!=='tow-mileage').forEach(k=>{modal.items[k]=0;});
      if(delta>0&&p.module==='carwash'&&p.category==='Lavados'){
        const others=state().catalog.filter(x=>x.module==='carwash'&&x.category==='Lavados'&&x.id!==p.id&&modal.items[x.id]>0);
        others.forEach(x=>{modal.items[x.id]=0;});if(others.length)toast('Cambiamos el lavado principal a '+p.name+'.');
      }
      modal.items[p.id]=Math.max(0,Math.min(max,current+delta));modal.meta.approved=false;modal.meta.compatibilityConfirmed=false;modal.error='';drawModal();return;
    }
    if(a==='confirm-order'){
      validateCustomer(modal);validateProducts(modal);
      const input={module:modal.module,items:selectedLines(modal).map(p=>({catalogId:p.id,quantity:p.quantity})),meta:{...modal.meta},idempotencyKey:modal.key};
      if(modal.accountMode==='existing')input.accountId=modal.accountId;else input.customer={...modal.customer};
      const created=store.createOrder(input);draft=null;onMutation('valdi:order.created',{order:created,billing:store.getBillingPayload(created.accountId)});openModal({type:'order-success',id:created.id});return;
    }
    if(a==='discard-draft'){draft=null;closeModal();return;}
    if(a==='resume-draft'){modal=modal.previous;drawModal(true);return;}
    if(a==='order-board'){closeModal();navigate(d.module);return;}
    if(a==='advance'){
      if(Date.now()-(advanceTimes.get(d.id)||0)<850)return;
      advanceTimes.set(d.id,Date.now());
      const updated=store.advanceOrder(d.id);onMutation('valdi:order.updated',updated);
      if(modal?.type==='account')drawModal();
      toast(D.MODULES[updated.module].name+': '+statusLabel(updated.module,updated.status)+'.');return;
    }
    if(a==='approve'){openModal({type:'approve',id:d.id,approved:false,error:''});return;}
    if(a==='confirm-approve'){
      if(!modal.approved)throw new Error('Confirma que el cliente aprobó el trabajo y su precio.');
      const updated=store.approveOrder(modal.id);onMutation('valdi:order.updated',updated);openModal({type:'account',id:updated.accountId});toast('Trabajo aprobado. El mecánico puede comenzar.');return;
    }
    if(a==='cancel-order'){openModal({type:'cancel-order',id:d.id,reason:'',error:''});return;}
    if(a==='confirm-cancel'){
      const updated=store.cancelOrder(modal.id,modal.reason);onMutation('valdi:order.cancelled',updated);openModal({type:'account',id:updated.accountId});toast('Pedido cancelado y cuenta actualizada.');return;
    }
    if(a==='payment'){beginPayment(d.id,d.mode||'full');return;}
    if(a==='payment-method'){
      modal.method=d.value;modal.error='';if(d.value!=='cash'&&modal.mode==='full')modal.amount=(summary(modal.id).balanceCents/100).toString();drawModal();return;
    }
    if(a==='quick-money'){
      modal.amount=(Number(d.value)/100).toString();modal.error='';drawModal();return;
    }
    if(a==='payment-next'){validatePayment(modal);modal.step=2;modal.error='';drawModal(true);return;}
    if(a==='payment-back'){modal.step=1;modal.error='';drawModal(true);return;}
    if(a==='confirm-payment'){
      validatePayment(modal);
      const p=store.recordPayment({accountId:modal.id,method:modal.method,amountCents:parseMoney(modal.amount),reference:modal.reference.trim(),mode:modal.mode,idempotencyKey:modal.key});
      onMutation('valdi:payment.recorded',{payment:p,billing:store.getBillingPayload(p.accountId)});openModal({type:'payment-success',id:p.id});return;
    }
    if(a==='receipt'){openModal({type:'receipt',id:d.id});return;}
    if(a==='print-receipt'){printReceipt(d.id);return;}
    if(a==='export-account'){downloadData(store.getBillingPayload(d.id),'Valdi-Cuenta-'+summary(d.id).account.code+'.json');return;}
    if(a==='export-data'){downloadData(store.exportData(),'Valdi-Datos-Demo-'+dayKey(new Date())+'.json');return;}
    if(a==='reset-demo'){openModal({type:'reset',value:'',error:''});return;}
    if(a==='confirm-reset'){
      if(modal.value.trim()!=='REINICIAR')throw new Error('Escribe REINICIAR en mayúsculas para confirmar.');
      store.reset();closeModal();navigate('home');toast('Demostración reiniciada con los datos de ejemplo.');return;
    }
    if(a==='sample-account'){
      const luis=account('account-luis');if(!luis){toast('Reinicia la demo para cargar el ejemplo de Luis.',true);return;}
      openModal({type:'account',id:luis.id});return;
    }
  }
  function globalSearch(value){
    const container=document.getElementById('global-results');if(!container)return;
    const query=clean(value.trim());if(!query){container.innerHTML='';return;}
    const s=state();
    const matches=s.accounts.filter(a=>clean([a.name,a.plate,a.vehicle,a.phone,a.code,a.table,...s.orders.filter(o=>o.accountId===a.id).map(o=>o.code)].join(' ')).includes(query)).slice(0,7);
    container.innerHTML='<div class="search-results">'+(matches.length?matches.map(a=>'<button data-action="account" data-id="'+E(a.id)+'"><span class="avatar">'+E(initials(a.name))+'</span><span class="grow"><span class="customer-name">'+E(a.name)+'</span><span class="customer-sub">'+E([a.plate,a.code,a.status==='paid'?'Pagada':'Abierta'].filter(Boolean).join(' · '))+'</span></span>'+I('chevron',14)+'</button>').join(''):'<div class="search-empty">No hay coincidencias. Busca por nombre, placa o cuenta.</div>')+'</div>';
  }
  function bindInput(el){
    if(!modal||!el.dataset.bind)return;
    const path=el.dataset.bind.split('.'),value=el.type==='checkbox'?el.checked:el.value;
    if(path.length===2&&['customer','meta'].includes(path[0]))modal[path[0]][path[1]]=value;
    else if(['amount','reference','approved','reason','value'].includes(path[0]))modal[path[0]]=value;
    if(modal.type==='wizard'&&path.length===2&&['plate','vehicle','issue'].includes(path[1])){modal.meta.approved=false;modal.meta.compatibilityConfirmed=false;const approvals=overlay.querySelectorAll('[data-bind="meta.approved"],[data-bind="meta.compatibilityConfirmed"]');approvals.forEach(input=>{input.checked=false;});}
    if(modal.type==='payment'&&modal.step===1&&el.dataset.bind==='amount'){
      const target=document.getElementById('payment-change');if(target)target.innerHTML=paymentChangeHtml(modal);
    }
  }
  document.addEventListener('click',event=>{
    const target=event.target.closest('[data-action]');
    if(!event.target.closest('.topbar-search')){const results=document.getElementById('global-results');if(results)results.innerHTML='';}
    if(!target||!target.isConnected||target.disabled||busy)return;
    event.preventDefault();busy=true;
    try{handleAction(target);}catch(error){
      if(modal&&['wizard','payment','new-account','cancel-order','approve','reset'].includes(modal.type)){modal.error=error.message||'Revisa los datos e intenta de nuevo.';drawModal(true);}
      else toast(error.message||'No se pudo completar el cambio.',true);
      if(store.persistenceStatus==='conflict'){renderApp();if(modal)drawModal();}
    }finally{busy=false;}
  });
  document.addEventListener('input',event=>{
    const el=event.target;bindInput(el);
    if(el.id==='global-search'){globalSearch(el.value);return;}
    if(['module-filter','cash-filter','inventory-filter'].includes(el.id)){
      const id=el.id,start=el.selectionStart,end=el.selectionEnd;ui.filter=el.value;renderApp();const restored=document.getElementById(id);restored?.focus({preventScroll:true});try{restored?.setSelectionRange(start,end);}catch(e){}
    }
  });
  document.addEventListener('change',event=>bindInput(event.target));
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape'){
      if(modal){requestClose();event.preventDefault();}
      else if(ui.menu){ui.menu=false;renderApp();}
      else {const results=document.getElementById('global-results');if(results)results.innerHTML='';}
    }
    if(event.key==='Tab'&&modal){
      const focusables=Array.from(overlay.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex="0"]')).filter(el=>el.getClientRects().length);
      const first=focusables[0],last=focusables[focusables.length-1];
      if(!first)return;
      if(event.shiftKey&&(document.activeElement===first||!focusables.includes(document.activeElement))){event.preventDefault();last.focus();}
      else if(!event.shiftKey&&(document.activeElement===last||!focusables.includes(document.activeElement))){event.preventDefault();first.focus();}
    }
  });
  window.addEventListener('storage',event=>{
    if(event.key==='valdi.salcedo.demo.v1'){
      ui.persistenceStatus='conflict';
      toast('La demo cambió en otra pestaña. Recarga antes de continuar.',true);
    }
  });
  window.addEventListener('beforeunload',event=>{
    if(modal?.type==='wizard'&&Object.values(modal.items).some(Boolean)){event.preventDefault();event.returnValue='';}
  });
  window.VALDI_DEMO=Object.freeze({version:'1.0.0',store,getState:state,getBillingPayload:id=>store.getBillingPayload(id),navigate,openAccount:id=>openModal({type:'account',id}),newOrder:newWizard,refresh:()=>{renderApp();if(modal)drawModal();},getUI:()=>({...ui,modal:modal?{type:modal.type,step:modal.step}:null})});
  window.GRIMATS_DEMO=window.VALDI_DEMO;
  renderApp();
})();
</script>
</body>
</html>
