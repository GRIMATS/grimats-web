function agendaView(){const s=state(),a=dayAppointments(s).filter(a=>ui.staff==='all'||a.staffId===ui.staff),d=ui.date;const calendar=()=>`<div class="calendar-scroll"><div class="calendar"><div class="calendar-header"><div>${I('clock')}</div>${s.team.map(t=>`<div><span class="avatar" style="background:${E(t.color)}">${E(t.initials)}</span>${E(t.name)}</div>`).join('')}</div><div class="calendar-body"><div class="hours">${Array.from({length:10},(_,i)=>`<span style="top:${i*80+8}px">${String(9+i).padStart(2,'0')}:00</span>`).join('')}</div>${s.team.map(t=>`<div class="staff-column">${a.filter(x=>x.staffId===t.id&&!['cancelled','no_show'].includes(x.status)).map(x=>`<button class="calendar-appointment ${E(x.status)}" style="top:${(D.toMinutes(x.time)-540)/60*80}px;height:${x.duration/60*80-5}px" data-action="appointment" data-id="${E(x.id)}"><span class="cal-name">${E(person(x.customerId,s).name)}</span><span class="cal-info">${E(x.time)}–${E(endTime(x))} · ${money(x.totalCents)}</span><span class="cal-info">${E(x.lines.map(l=>l.name).join(' + '))}</span>${x.duration>=60?`<span class="cal-status">${E(D.statusLabels[x.status])}</span>`:''}</button>`).join('')}</div>`).join('')}</div></div></div><div class="legend"><span><i></i>Reservada / confirmada</span><span><i class="amber"></i>Lista para cobrar</span><span><i class="green"></i>Horario de muestra: 9:00 a 19:00</span></div>`;return head('Tu agenda, en armonía.','Cada cita tiene su espacio y su especialista.','AGENDA',button('Nueva cita','new-appointment','plus','primary'))+`<section class="panel"><div class="toolbar"><div class="toolbar-group"><button class="icon-btn" data-action="date-shift" data-days="-1" aria-label="Día anterior">${I('left')}</button><input type="date" id="agendaDate" value="${E(d)}" aria-label="Fecha de agenda"><button class="icon-btn" data-action="date-shift" data-days="1" aria-label="Día siguiente">${I('right')}</button>${button('Hoy','date-today',null,'small')}</div><div class="toolbar-group" function inventoryView(){const s=state(),low=s.inventory.filter(x=>x.stock<=x.min);return head('Lo que necesitas para crear.','Insumos al día, sin sorpresas en la mesa.','INSUMOS',`<span class="pill ${low.length?'completed':'confirmed'}">${low.length} por reponer</span>`)+`<section class="help-strip">${I('box')}Al finalizar un servicio se descuentan sus insumos una sola vez. Puedes registrar entradas y ajustes con un motivo.</section><div class="inventory-grid">${s.inventory.map(v=>`<article class="inventory-card"><div class="inventory-top"><span class="inventory-icon" style="background:${E(v.color)}44">${I('box')}</span><span class="pill ${v.stock<=v.min?'completed':'confirmed'}">${v.stock<=v.min?'Reponer':'Disponible'}</span></div><h3>${E(v.name)}</h3><div class="stock-number">${v.stock}<small>${E(v.unit)}</small></div><div class="stock-track"><i style="width:${Math.min(100,v.stock/Math.max(1,v.min*4)*100)}%;background:${v.stock<=v.min?'#d0ad72':'#bf94a7'}"></i></div><div class="small muted">Avisar con ${v.min} ${E(v.unit)} o menos</div>${button('Registrar movimiento','inventory-edit','plus','full small',`data-id="${E(v.id)}"`)}</article>`).join('')}</div>`;}
function cashView(){const s=state(),pending=s.appointments.filter(a=>a.status==='completed').sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time));ui.selected=ui.selected.filter(id=>pending.some(a=>a.id===id));const selected=pending.filter(a=>ui.selected.includes(a.id)),total=selected.reduce((n,a)=>n+a.totalCents,0),deposit=selected.reduce((n,a)=>n+store.depositTotal(a.id),0),due=total-deposit;return head('Una atención. Una sola cuenta.','Servicios, abonos y recibos en la caja central.','CAJA',button('Ver recibos','receipts','receipt','soft'))+`<div class="cash-grid"><div><section class="panel"><div class="panel-head"><div><h2>Listas para cobrar <span class="tab-count">${pending.length}</span></h2><p>Selecciona la cuenta de una clienta</p></div><span class="subtle">USD · US$</span></div>${pending.length?pending.map(a=>`<label class="cash-order"><input type="checkbox" data-cash-id="${E(a.id)}" ${ui.selected.includes(a.id)?'checked':''} ${selected.length&&selected[0].customerId!==a.customerId?'disabled':''}><span class="cash-order-content"><strong>${E(person(a.customerId,s).name)}</strong><p>${E(a.lines.map(l=>l.name).join(' + '))}</p><small class="muted small">${E(dateShort(a.date))} · ${E(a.time)} · ${E(staff(a.staffId,s).name)}</small>${store.depositTotal(a.id)?`<p>Abono registrado: ${money(store.depositTotal(a.id))}</p>`:''}</span><span class="cash-order-amount">${money(store.totalDue([a.id]))}</span></label>`).join(''):empty('Todo al día','Las citas aparecen aquí al finalizar el servicio.',button('Ir a agenda','view','calendar','soft','data-view="agenda"'),'check')}<div class="activity-note">Puedes unir varias citas de la misma clienta en un solo recibo.</div></section><section class="panel receipt-list"><div class="panel-head"><div><h2>Últimos recibos</h2><p>Pagos simulados, sin emisión fiscal</p></div></div>${s.receipts.slice().reverse().slice(0,4).map(r=>receiptRow(r,s)).join('')}</section></div><section class="panel order-summary"><h2>Resume function serviceForm(id){const v=state().services.find(x=>x.id===id);modal('Ajustar un servicio.','Los cambios se aplican a las nuevas reservas.',`<input type="hidden" name="id" value="${E(id)}">${field('Nombre del servicio','name',v.name,'text','required maxlength="90"')}<div class="field-row">${field('Precio final de ejemplo (USD)','price',v.priceCents/100,'number','required min="0" step="0.01"')}${field('Duración en minutos','duration',v.duration,'number','required min="15" max="600" step="15"')}</div><div class="field"><label for="f-category">Categoría</label><select id="f-category" name="category">${['Manos','Pies','Extras'].map(c=>`<option ${v.category===c?'selected':''}>${c}</option>`).join('')}</select></div>${area('Descripción','description',v.description)}<div class="catalog-notice">Las citas ya reservadas conservan su precio y duración. Los consumos de insumos se definen en la receta del servicio.</div>`,formButtons(),'serviceForm');}
function inventoryForm(id){const v=state().inventory.find(x=>x.id===id);modal('Un movimiento de insumos.',`${E(v.name)} · Disponibles: ${v.stock} ${E(v.unit)}`,`<input type="hidden" name="id" value="${E(id)}"><div class="field"><label for="f-direction">¿Qué vas a registrar?</label><select id="f-direction" name="direction"><option value="in">Entrada de insumos</option><option value="out">Salida / ajuste de insumos</option></select></div>${field(`Cantidad (${E(v.unit)})`,'quantity','','number','required min="0.001" step="0.001"')}${area('Motivo *','reason','','Ej. Compra de reposición, merma o ajuste de conteo')}<p class="note">Los consumos de cada servicio se registran automáticamente al finalizarlo.</p>`,formButtons('Registrar movimiento'),'inventoryForm');}
function depositForm(id){const s=state(),a=s.appointments.find(x=>x.id===id),remaining=a.totalCents-store.depositTotal(id);modal('Un abono para su cita.',`${E(person(a.customerId,s).name)} · Saldo de la cita: ${money(remaining)}`,`<input type="hidden" name="appointmentId" value="${E(id)}">${field('Monto recibido (USD)','amount','','number',`required min="0.01" max="${remaining/100}" step="0.01"`)}<div class="field"><label for="f-method">Forma de recepción</label><select id="f-method" name="method"><option value="cash">Efectivo</option><option value="transfer">Transferencia</option><option value="card">Tarjeta</option></select></div>${field('Referencia (obligatoria para tarjeta / transferencia)','reference','','text','maxlength="80"')}<p class="note">Registro simulado. El abono se descontará automáticamente al cerrar la cuenta.</p>`,formButtons('Registrar abono'),'depositForm');}
function refundForm(id){const d=state().deposits.find(x=>x.id===id);modal('Devolver un abono.','Esta acción se simula en el demo.',`<input type="hidden" name="id" value="${E(id)}"><div class="booking-total"><span>Abono a devolver</span><strong>${money(d.amountCents)}</strong></div><div style="margin-top:18px">${area('Motivo de la devolución *','reason','','Indica por qué se devuelve este abono')}</div><p class="note">En operación real se debe confirmar la devolución con el proveedor de pagos y la caja central.</p>`,formButtons('Confirmar devolución'),'refundForm');}
function receiptHTML(r){const s=state(),list=s.appointments.filter(a=>r.appointmentIds.includes(a.id));return `<div class="receipt"><div class="receipt-logo">rose</div><h3>NAILS STUDIO</h3><p class="receipt-number">${E(r.number)}</p><p class="small muted">${E(person(r.customerId,s).name)}<br>${E(new Date(r.createdAt).toLocaleString('es-US',{timeZone:D.timeZone}))}</p>${list.map(a=>a.lines.map(l=>`<div class="receipt-line"><span>${E(l.name)}</span><span>${money(l.priceCents*l.quantity)}</span></div>`).join('')).join('')}<div class="receipt-line"><span>Total servicios</span><span>${money(r.totalCents)}</span></div><div class="receipt-line"><span>Abonos aplicados</span><span>${money(r.depositCents)}</span></div><div class="receipt-big">${money(r.dueCents)}</div><p class="small muted">Cobrado al cierre · ${E({cash:'Efectivo',card:'Tarjeta',transfer:'Transferencia'}[r.method])}</p><div class="receipt-line"><span>Recibido</span><span>${money(r.receivedCents)}</span></div>${r.method==='cash'?`<div class="receipt-line"><span>Cambio devuelto</span><span>${money(r.changeCents)}</span></div>`:''}${r.reference?`<p class="note">Referencia: ${E(r.reference)}</p>`:''}<span class="stamp">${I('check')} CUENTA CERRADA · DEMO</span><p class="note">Gracias por poner tus manos en las nuestras.<br>Recibo de demostración sin valor fiscal.<br>No representa un pago real.</p></div>`;}
function receiptDetail(id){const r=state().receipts.find(x=>x.id===id);if(!r)return toast('No se encontró el recibo.');modal('Cuenta cerrada.','Todo queda en un mismo lugar.',receiptHTML(r),button('Imprimir recibo','print','print','',`data-id="${E(id)}"`)+button('Detalle para GRIMATS','receipt-payload','link','soft',`data-id="${E(id)}"`));}
let checkoutPending=null;
function checkoutReview(){const s=state(),ids=[...ui.selected];if(!ids.length)return toast('Selecciona una cuenta.');const amount=Math.round(Number(ui.received||0)*100),due=store.totalDue(ids);if(!Number.isSafeInteger(amount)||amount<due)return toast('El monto recibido no alcanza para pagar la cuenta.');if(ui.method!=='cash'&&amount!==due)return toast('Registra el monto exacto para tarjeta o transferencia.');if(ui.method!=='cash'&&due>0&&ui.reference.trim().length<3)return toast('Escribe la referencia del pago.');checkoutPending={appointmentIds:ids,method:ui.method,receivedCents:amount,reference:ui.reference,idempotencyKey:'rose_'+(window.crypto?.randomUUID?.()||Date.now()+'_'+Math.random())};const a=s.appointments.find(a=>a.id===ids[0]);modal('Revisemos antes de cobrar.','Un último vistazo para que todo cuadre.',`<div class="detail-client"><span class="avatar">${E(initials(person(a.customerId,s).name))}</span><div><h3>${E(person(a.customerId,s).name)}</h3><p>${ids.length} cita${ids.length===1?'':'s'} en esta cuenta</p></div></div><div class="summary-line"><span>Forma de pago</span><strong>${E({cash:'Efectivo',card:'Tarjeta',transfer:'Transferencia'}[ui.method])}</strong></div><div class="summary-total"><span>Por cobrar al cierre</span><strong>${money(due)}</strong></div><div class="summary-line"><span>Recibido</span><strong>${money(amount)}</strong></div>${ui.method==='cash'?`<div class="change-box"><span>Devuelve a la clienta</span><strong>${money(amount-due)}</strong></div>`:`<p class="note">Referencia: ${E(ui.reference)}</p>`}<p class="note">Pago simulado. El demo bloqueará nuevos cobros para estas citas.</p>`,button('Volver a caja','close',null)+button('Confirmar cobro','checkout-confirm','check','primary'));}
function integration(payload){const s=state();modal('Rose + GRIMATS','Módulo especializado con facturación centralizada.',`<div class="integration-status">${I('link')}<div>Conexión preparada<small>Demo local · Backend todavía sin conectar</small></div></div><p class="small muted">Cada servicio genera líneas con su clienta, cita y origen. El backend central debe validar disponibilidad, impuestos, permisos y cobro antes de emitir un documento real.</p><div class="howto-step"><span>1</span><div><b>Rose organiza la visita</b><p>Clienta, especialista, horario, servicios e insumos.</p></div></div><div class="howto-step"><span>2</span><div><b>La caja reúne la cuenta</b><p>Precios conservados y abonos aplicados una sola vez.</p></div></div><div class="howto-step"><span>3</span><div><b>GRIMATS recibe el detalle</b><p>Un adaptador REST y eventos permiten enlazar el módulo a tu plataforma.</p></div></div>${payload?`<pre class="code-preview">${E(JSON.stringify(payload,null,2))}</pre>`:`<pre class="code-preview">businessId: ${E(s.business.id)}\nmodule: beauty-studio\ncurrency: USD\nmode: local-demo\nAPI: no configurada</pre>`}`,button('Entendido','close','check','primary'));}
function settings(){const s=state();modal('A tu manera.','Opciones del demo · No cambia sistemas reales.',`<div class="settings-item"><div><h3>Datos de demostración</h3><p>Servicios, tarifas, especialistas, clientas y citas son ejemplos editables.</p></div><span class="demo-tag">V1</span></div><div class="settings-item"><div><h3>Conserva tus pruebas</h3><p>${s.persistenceAvailable?'Tus cambios se guardan en este navegador.':'El almacenamiento no está disponible; conserva una exportación de tus pruebas.'}</p></div>${button('Exportar','export','download','small')}</div><div class="settings-item"><div><h3>Equipo del estudio</h3><p>Ajusta los nombres y las especialidades de las tres personas de muestra.</p></div>${button('Editar','team',null,'small')}</div><div class="settings-item"><div><h3>Conexión con GRIMATS</h3><p>Adaptador REST y contrato de integración incluidos en la entrega.</p></div>${button('Ver','integration',null,'small')}</div><div class="settings-item"><div><h3>Comenzar de nuevo</h3><p>Elimina los cambios locales y restaura el escenario de demostración para hoy.</p></div>${button('Restablecer','reset-review','refresh','danger small')}</div><div class="catalog-notice">Diseño conceptual para Rose Nails Studio. Se debe confirmar con el negocio su catálogo, identidad visual, horarios, personal y políticas.</div>`,button('Listo','close','check','primary'));}
function teamList(){const s=state();modal('El talento de tu estudio.','Equipo de demostración · 3 especialistas',s.team.map(t=>`<div class="team-editor"><span class="avatar" style="background:${E(t.color)}">${E(t.initials)}</span><div><b>${E(t.name)}</b><small>${E(t.role)}</small></div>${button('Editar','team-edit','edit','small',`data-id="${E(t.id)}"`)}</div>`).join('')+'<p class="note" style="margin-top:18px">Los horarios de trabajo y permisos de acceso se administrarán desde el backend.</p>',button('Cerrar','close',null,'primary'));}
function help(){modal('Prueba una visita de principio a fin.','Todo funciona con datos de ejemplo.',`<div class="howto-step"><span>1</span><div><b>Agenda una cita</b><p>Elige clienta, uno o más servicios y un horario disponible.</p></div></div><div class="howto-step"><span>2</span><div><b>Acompaña su visita</b><p>Confirma, marca su llegada, inicia y finaliza el servicio desde la ficha de la cita.</p></div></div><div class="howto-step"><span>3</span><div><b>Cierra su cuenta</b><p>En Caja, selecciona la clienta, registra cómo paga y confirma. Puedes consultar o imprimir el recibo.</p></div></div><div class="catalog-notice">Para probar un cobro de inmediato, Laura ya tiene un servicio terminado. Paola está en servicio y tiene un abono de USD 20.00.</div>`,button('Vamos a probar','close','check','primary'));}
function download(name,text,mime='application/json'){const blob=new Blob([text],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
document.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action,id=b.dataset.id;if(b.tagName==='A')event.preventDefault();
 switch(action){
 case 'view':navigate(b.dataset.view);break;
 case 'menu':$('.sidebar').classList.toggle('open');break;
 case 'close':closeModal();break;
 case 'help':help();break;
 case 'new-appointment':appointmentForm(null,b.dataset.service,b.dataset.customer);break;
 case 'appointment':appointmentDetail(id);break;
 case 'appointment-edit':appointmentForm(id);break;
 case 'new-customer':customerForm();break;
 case 'customer-edit':customerForm(id);break;
 case 'customer':customerDetail(id);break;
 case 'date-shift':ui.date=D.datePlus(ui.date,Number(b.dataset.days));render();break;
 case 'date-today':ui.date=D.today();render();break;
 case 'agenda-mode':ui.agendaMode=b.dataset.mode;render();break;
 case 'category':ui.category=b.dataset.category;render();break;
 case 'service-edit':serviceForm(id);break;
 case 'inventory-edit':inventoryForm(id);break;
 case 'team':teamList();break;
 case 'team-edit':{const t=staff(id);modal('Editar especialista.','Su historial conserva el mismo identificador.',`<input type="hidden" name="id" value="${E(id)}">${field('Nombre','name',t.name,'text','required minlength="2" maxlength="60"')}${field('Especialidad','role',t.role,'text','required maxlength="90"')}`,formButtons(),'teamForm');break;}
 case 'booking-back':if(pendingBooking){const p=pendingBooking;appointmentForm(p.id,null,p.customerId);const f=$('#appointmentForm');f.elements.date.value=p.date;f.elements.staffId.value=p.staffId;f.elements.notes.value=p.notes;$$('[name=serviceIds]',f).forEach(x=>x.checked=p.serviceIds.includes(x.value));$('#f-time').dataset.preferred=p.time;$('#f-time').innerHTML='';updateBooking();}break;
 case 'booking-confirm':{if(!pendingBooking)break;const result=run(pendingBooking.id?'appointment.update':'appointment.create',pendingBooking);if(result.ok){pendingBooking=null;closeModal();render();toast('Cita guardada. Todo tiene su espacio.');appointmentDetail(result.data.id);}else err(result.error);break;}
 case 'status':{const r=run('appointment.status',{id,status:b.dataset.status});if(r.ok){render();appointmentDetail(id);toast(b.dataset.status==='completed'?'Servicio terminado. Su cuenta ya está en caja.':'Estado de la cita actualizado.');}else err(r.error);break;}
 case 'cancel-review':case 'no-show-review':{const a=state().appointments.find(a=>a.id===id),status=action==='cancel-review'?'cancelled':'no_show';modal(status==='cancelled'?'¿Cancelar esta cita?':'¿La clienta no asistió?',`${E(person(a.customerId).name)} · ${E(dateShort(a.date))} · ${E(a.time)}`,`<p class="small muted">La cita quedará en el historial y liberará este espacio en la agenda.</p>${store.depositTotal(id)?'<div class="detail-care">Hay un abono pendiente. Primero registra su devolución desde la ficha de la cita.</div>':''}`,button('Volver a la cita','appointment',null,'',`data-id="${E(id)}"`)+button('Sí, confirmar','status',null,'danger',`data-id="${E(id)}" data-status="${status}" ${store.depositTotal(id)?'disabled':''}`));break;}
 case 'deposit':depositForm(id);break;
 case 'refund':refundForm(id);break;
 case 'appointment-cash':ui.selected=[id];ui.received=String(store.totalDue([id])/100);ui.reference='';closeModal();navigate('caja');break;
 case 'method':ui.method=b.dataset.method;if(ui.method!=='cash'&&ui.selected.length)ui.received=String(store.totalDue(ui.selected)/100);render();break;
 case 'checkout-review':checkoutReview();break;
 case 'checkout-confirm':{if(!checkoutPending)break;const payload=store.billingPayload(checkoutPending.appointmentIds),r=run('checkout',checkoutPending);if(r.ok){const detail={schemaVersion:1,type:'billing.demo.completed',billingRequest:payload,receipt:r.data,demo:true};window.dispatchEvent(new CustomEvent('grimats:billing-demo-completed',{detail}));checkoutPending=null;ui.selected=[];ui.received='';ui.reference='';render();receiptDetail(r.data.id);toast('Cuenta cerrada. Recibo de demostración guardado.');}else err(r.error);break;}
 case 'receipt':receiptDetail(id);break;
 case 'receipts':{const s=state();modal('Cada cuenta, en orden.','Recibos simulados de este navegador.',s.receipts.slice().reverse().map(r=>receiptRow(r,s)).join('')||empty('Todavía sin recibos','Cobra un servicio para comenzar.',null,'receipt'),button('Cerrar','close',null,'primary'));break;}
 case 'print':{const r=state().receipts.find(r=>r.id===id);if(r){$('#printArea').innerHTML=receiptHTML(r);window.print();}break;}
 case 'receipt-payload':{const r=state().receipts.find(r=>r.id===id);if(r){const p=store.billingPayload(r.appointmentIds);p.depositCents=r.depositCents;p.receiptId=r.id;p.idempotencyKey=r.idempotencyKey;integration(p);}break;}
 case 'integration':integration();break;
 case 'settings':settings();break;
 case 'export':download('Rose_Nails_Studio_Demo_Datos.json',store.exportState());toast('Exportación de datos preparada.');break;
 case 'reset-review':modal('¿Volver al punto de partida?','Solo se restablecen los datos de este demo.',`<p class="small muted">Se eliminarán las citas y cambios locales que hayas creado. Puedes exportarlos desde Ajustes antes de continuar.</p>`,button('Conservar cambios','close',null)+button('Sí, restablecer demo','reset',null,'danger'));break;
 case 'reset':try{store.reset();ui.selected=[];ui.date=D.today();ui.search='';ui.received='';ui.reference='';closeModal();navigate('hoy');toast('Demo restablecido con las citas de hoy.');}catch(e){err(e.message);}break;
 }
});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='agendaDate'){ui.date=el.value||D.today();render();}else if(el.id==='agendaStaff'){ui.staff=el.value;render();}else if(el.matches('[data-cash-id]')){if(el.checked)ui.selected.push(el.dataset.cashId);else ui.selected=ui.selected.filter(id=>id!==el.dataset.cashId);ui.received=ui.selected.length?String(store.totalDue(ui.selected)/100):'';render();}else if(el.closest('#appointmentForm'))updateBooking();});
document.addEventListener('input',e=>{if(e.target.id==='cashReceived'){ui.received=e.target.value;$('#changeAmount').textContent=money(ui.method==='cash'?Math.max(0,Math.round(Number(ui.received||0)*100)-(ui.selected.length?store.totalDue(ui.selected):0)):(ui.selected.length?store.totalDue(ui.selected):0));}else if(e.target.id==='paymentReference'){ui.reference=e.target.value;}else if(e.target.id==='clientSearch'){const start=e.target.selectionStart;ui.search=e.target.value;render();const f=$('#clientSearch');f.focus();try{f.setSelectionRange(start,start);}catch(_){}}});
$('#globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){ui.search=e.target.value;navigate('clientas');}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,p=Object.fromEntries(new FormData(f)),fId=f.id;let r;
 if(fId==='customerForm'){if(!p.id)delete p.id;r=store.command('customer.save',p);if(r.ok){render();customerDetail(r.data.id);toast('Ficha de clienta guardada.');}}
 else if(fId==='appointmentForm'){p.serviceIds=new FormData(f).getAll('serviceIds');if(!p.serviceIds.length)return err('Elige al menos un servicio.');if(!p.time)return err('Elige un horario disponible.');if(p.customerId==='__new'){const cr=store.command('customer.save',{name:p.quickName,phone:p.quickPhone});if(!cr.ok)return err(cr.error);p.customerId=cr.data.id;}delete p.quickName;delete p.quickPhone;if(!p.id)delete p.id;reviewBooking(p);return;}
 else if(fId==='serviceForm'){r=store.command('service.save',{...p,priceCents:Math.round(Number(p.price)*100),duration:Number(p.duration)});if(r.ok){closeModal();render();toast('Servicio actualizado para las próximas reservas.');}}
 else if(fId==='teamForm'){r=store.command('team.save',p);if(r.ok){render();teamList();toast('Especialista actualizada.');}}
 else if(fId==='inventoryForm'){r=store.command('inventory.adjust',{id:p.id,quantity:Number(p.quantity)*(p.direction==='out'?-1:1),reason:p.reason});if(r.ok){closeModal();render();toast('Movimiento de insumos registrado.');}}
 else if(fId==='depositForm'){r=store.command('deposit.add',{appointmentId:p.appointmentId,amountCents:Math.round(Number(p.amount)*100),method:p.method,reference:p.reference,idempotencyKey:'dep_'+(window.crypto?.randomUUID?.()||Date.now()+'_'+Math.random())});if(r.ok){render();appointmentDetail(p.appointmentId);toast('Abono registrado. Se aplicará al cobrar.');}}
 else if(fId==='refundForm'){const dep=state().deposits.find(d=>d.id===p.id);r=store.command('deposit.refund',p);if(r.ok){render();appointmentDetail(dep.appointmentId);toast('Devolución de abono simulada.');}}
 if(r&&!r.ok)err(r.error);
});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const rect=$('#modal').getBoundingClientRect();if(e.clientX<rect.left||e.clientX>rect.right||e.clientY<rect.top||e.clientY>rect.bottom)closeModal();}});
document.addEventListener('click',e=>{if($('.sidebar').classList.contains('open')&&!e.target.closest('.sidebar')&&!e.target.closest('[data-action=menu]'))$('.sidebar').classList.remove('open');});
window.addEventListener('hashchange',()=>navigate(location.hash.slice(1)));
window.RoseStudio={store,adapter:D.createApiAdapter,exportBilling:ids=>store.billingPayload(ids),navigate,version:'1.0.1-usd',mode:'local-demo'};
$('#searchIcon').innerHTML=I('search');$('#helpIcon').innerHTML=I('help');$('#settingsIcon').innerHTML=I('settings');
navigate(location.hash.slice(1)||'hoy');
})();
</script>
</body>
</html>
