<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="referrer" content="no-referrer" />
  <title>PuntoFlex 360 | Demo visual no indexable</title>
  <style>
    :root {
      --bg: #f7f4ee;
      --surface: #fffaf4;
      --surface-2: #ffffff;
      --surface-3: #fff2df;
      --ink: #1e1712;
      --muted: #756b61;
      --soft: #dfd4c8;
      --line: #e7dccf;
      --primary: #8b3dff;
      --primary-dark: #5d24c7;
      --primary-soft: #efe3ff;
      --mint: #24b47e;
      --mint-soft: #dff8ed;
      --amber: #f6a529;
      --amber-soft: #fff1d3;
      --danger: #dc4c4c;
      --danger-soft: #ffe2e2;
      --blue: #2684ff;
      --blue-soft: #e4f0ff;
      --brown: #7a4a28;
      --brown-soft: #f4e6da;
      --shadow: 0 18px 55px rgba(58, 44, 34, .12);
      --shadow-sm: 0 10px 30px rgba(58, 44, 34, .08);
      --radius: 22px;
      --radius-sm: 14px;
      --sidebar: 310px;
      --topbar: 74px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(139, 61, 255, .16), transparent 32rem),
        radial-gradient(circle at 82% 0%, rgba(36, 180, 126, .12), transparent 30rem),
        linear-gradient(135deg, #fffaf4 0%, #f7f4ee 40%, #f1eee8 100%);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }

    .demo-shell {
      display: grid;
      grid-template-columns: var(--sidebar) minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 18px 16px 18px 18px;
      border-right: 1px solid rgba(231, 220, 207, .8);
      background: rgba(255, 250, 244, .88);
      backdrop-filter: blur(20px);
      overflow-y: auto;
      z-index: 30;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 10px 18px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 14px;
    }

    .brand-mark {
      width: 46px;
      height: 46px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--primary), #ff7ac8 60%, #ffc166);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 900;
      letter-spacing: -.08em;
      box-shadow: 0 12px 24px rgba(139, 61, 255, .26);
    }

    .brand h1 {
      font-size: 17px;
      line-height: 1.05;
      margin: 0;
      letter-spacing: -.04em;
    }

    .brand p {
      color: var(--muted);
      margin: 4px 0 0;
      font-size: 12px;
      font-weight: 650;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 800;
      border: 1px solid rgba(139, 61, 255, .18);
      background: var(--primary-soft);
      color: var(--primary-dark);
      white-space: nowrap;
    }

    .pill.mint { background: var(--mint-soft); color: #08764e; border-color: rgba(36, 180, 126, .22); }
    .pill.amber { background: var(--amber-soft); color: #89530c; border-color: rgba(246, 165, 41, .24); }
    .pill.blue { background: var(--blue-soft); color: #145eb8; border-color: rgba(38, 132, 255, .2); }
    .pill.danger { background: var(--danger-soft); color: #a53030; border-color: rgba(220, 76, 76, .22); }
    .pill.brown { background: var(--brown-soft); color: var(--brown); border-color: rgba(122, 74, 40, .18); }
    .pill.gray { background: #f1eee8; color: #5e554d; border-color: #ded5ca; }

    .role-panel {
      margin: 14px 0;
      padding: 12px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.68);
      border-radius: 18px;
    }

    .role-panel label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 8px;
    }

    .role-panel select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      padding: 10px 12px;
      color: var(--ink);
      font-weight: 750;
      outline: none;
    }

    .nav-section { margin: 12px 0; }

    .nav-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border: 0;
      background: transparent;
      color: #5c5046;
      padding: 11px 10px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-weight: 900;
      border-radius: 12px;
    }

    .nav-title:hover { background: rgba(139, 61, 255, .06); }

    .nav-items {
      display: grid;
      gap: 4px;
      padding: 0 4px 0 8px;
      max-height: 600px;
      overflow: hidden;
      transition: max-height .25s ease, opacity .2s ease;
    }

    .nav-section.collapsed .nav-items { max-height: 0; opacity: .35; }
    .nav-section.collapsed .chev { transform: rotate(-90deg); }
    .chev { transition: transform .2s ease; }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 0;
      width: 100%;
      text-align: left;
      background: transparent;
      color: #3a3028;
      padding: 10px;
      border-radius: 14px;
      font-weight: 750;
      font-size: 14px;
      position: relative;
    }

    .nav-link:hover { background: rgba(139, 61, 255, .07); }
    .nav-link.active {
      background: linear-gradient(135deg, rgba(139,61,255,.14), rgba(255,122,200,.10));
      color: var(--primary-dark);
      box-shadow: inset 0 0 0 1px rgba(139, 61, 255, .16);
    }

    .nav-icon {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: #fff;
      border: 1px solid var(--line);
      box-shadow: 0 5px 12px rgba(54,39,24,.05);
      flex: 0 0 auto;
    }

    .nav-link.active .nav-icon { border-color: rgba(139,61,255,.28); background: var(--primary-soft); }

    .main {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      position: sticky;
      top: 0;
      height: var(--topbar);
      z-index: 25;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 22px;
      border-bottom: 1px solid rgba(231, 220, 207, .82);
      background: rgba(247, 244, 238, .82);
      backdrop-filter: blur(18px);
    }

    .mobile-toggle {
      display: none;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 14px;
      padding: 10px 12px;
      font-weight: 900;
    }

    .search {
      flex: 1;
      max-width: 620px;
      position: relative;
    }

    .search input {
      width: 100%;
      height: 46px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 0 44px 0 46px;
      outline: none;
      font-weight: 650;
      box-shadow: 0 8px 22px rgba(58, 44, 34, .05);
    }

    .search .magnify {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .btn {
      border: 0;
      border-radius: 15px;
      padding: 11px 14px;
      font-weight: 850;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      box-shadow: 0 12px 26px rgba(139, 61, 255, .22);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      white-space: nowrap;
    }

    .btn:hover { filter: brightness(.98); transform: translateY(-1px); }
    .btn.secondary {
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line);
      box-shadow: 0 8px 18px rgba(58,44,34,.06);
    }
    .btn.mint { background: linear-gradient(135deg, var(--mint), #0e8e63); box-shadow: 0 12px 26px rgba(36,180,126,.22); }
    .btn.amber { background: linear-gradient(135deg, #ffbc4b, #f18a00); box-shadow: 0 12px 26px rgba(246,165,41,.22); }
    .btn.danger { background: linear-gradient(135deg, #ff6a6a, #c43131); box-shadow: 0 12px 26px rgba(220,76,76,.20); }
    .btn.blue { background: linear-gradient(135deg, var(--blue), #075bc5); box-shadow: 0 12px 26px rgba(38,132,255,.20); }
    .btn.ghost { background: transparent; color: var(--primary-dark); border: 1px solid rgba(139,61,255,.22); box-shadow: none; }
    .btn.small { padding: 8px 10px; border-radius: 12px; min-height: 34px; font-size: 12px; }

    .content {
      padding: 22px;
      width: 100%;
      max-width: 1600px;
      margin: 0 auto;
    }

    .notice {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 16px;
      border-radius: 18px;
      background: rgba(255, 255, 255, .72);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-sm);
      margin-bottom: 18px;
    }

    .notice strong { font-size: 14px; }
    .notice span { color: var(--muted); font-size: 13px; font-weight: 650; }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(420px, .9fr);
      gap: 22px;
      margin-bottom: 22px;
    }

    .hero-card,
    .card,
    .panel {
      background: rgba(255, 250, 244, .78);
      border: 1px solid rgba(231, 220, 207, .9);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .hero-card {
      padding: clamp(24px, 4vw, 44px);
      position: relative;
      overflow: hidden;
      min-height: 360px;
    }

    .hero-card:before {
      content: "";
      position: absolute;
      inset: -70px -60px auto auto;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(139,61,255,.18), transparent 68%);
      pointer-events: none;
    }

    .hero-eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    h2, h3, h4, p { margin-top: 0; }

    .hero-card h2 {
      margin: 0;
      font-size: clamp(38px, 5.4vw, 78px);
      line-height: .92;
      letter-spacing: -.075em;
      max-width: 900px;
    }

    .hero-card .lead {
      margin: 18px 0 0;
      color: #5b5046;
      font-size: clamp(17px, 1.6vw, 21px);
      line-height: 1.48;
      max-width: 840px;
      font-weight: 610;
    }

    .hero-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 26px; }

    .hero-mini-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 28px;
    }

    .mini-stat {
      padding: 14px;
      border-radius: 18px;
      background: rgba(255,255,255,.78);
      border: 1px solid var(--line);
      min-height: 96px;
    }

    .mini-stat strong {
      display: block;
      font-size: 24px;
      letter-spacing: -.04em;
      line-height: 1;
      margin-bottom: 6px;
    }

    .mini-stat span { color: var(--muted); font-weight: 700; font-size: 12px; }

    .device-card {
      padding: 22px;
      min-height: 360px;
      background: linear-gradient(160deg, rgba(31,23,18,.94), rgba(65,40,82,.93));
      color: #fff;
      overflow: hidden;
      position: relative;
    }

    .device-card:after {
      content: "";
      position: absolute;
      inset: auto -80px -90px auto;
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, rgba(255,193,102,.35), transparent 70%);
      border-radius: 50%;
    }

    .mock-pos {
      position: relative;
      border-radius: 25px;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.18);
      padding: 14px;
      z-index: 1;
      backdrop-filter: blur(16px);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.05), 0 20px 45px rgba(0,0,0,.22);
    }

    .mock-pos-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 12px;
    }

    .dotrow { display: flex; gap: 6px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #ff7a7a; }
    .dot:nth-child(2) { background: #ffd166; }
    .dot:nth-child(3) { background: #54d18a; }

    .mock-screen {
      display: grid;
      grid-template-columns: 1fr 170px;
      gap: 12px;
    }

    .mock-categories {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .mock-tile {
      min-height: 86px;
      border-radius: 18px;
      padding: 12px;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.14);
    }

    .mock-tile .emoji { font-size: 28px; margin-bottom: 8px; display: block; }
    .mock-tile b { display: block; line-height: 1.1; }
    .mock-tile small { color: rgba(255,255,255,.65); font-weight: 650; }

    .mock-cart {
      border-radius: 18px;
      background: rgba(255,255,255,.92);
      color: var(--ink);
      padding: 12px;
    }

    .cart-line, .cart-total {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      font-weight: 750;
      padding: 8px 0;
      border-bottom: 1px dashed #e0d7ca;
    }
    .cart-total { border-bottom: 0; font-size: 16px; color: var(--primary-dark); }

    .section-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 16px;
    }

    .section-head h2 {
      margin: 0 0 7px;
      font-size: clamp(26px, 3vw, 42px);
      letter-spacing: -.055em;
      line-height: 1;
    }

    .section-head p {
      color: var(--muted);
      margin: 0;
      font-weight: 650;
      line-height: 1.45;
      max-width: 820px;
    }

    .grid { display: grid; gap: 16px; }
    .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .grid.auto { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    .grid.sidebar-layout { grid-template-columns: minmax(0, 1fr) 390px; }
    .grid.pos-layout { grid-template-columns: minmax(0, 1fr) 420px; }

    .card, .panel { padding: 18px; }
    .card.flat { box-shadow: none; background: rgba(255,255,255,.72); }
    .card h3, .panel h3 {
      font-size: 20px;
      margin: 0 0 10px;
      letter-spacing: -.035em;
    }
    .card p, .panel p {
      color: var(--muted);
      font-weight: 620;
      line-height: 1.44;
      margin-bottom: 12px;
    }

    .metric-card {
      min-height: 142px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .metric-card:after {
      content: "";
      position: absolute;
      right: -42px;
      top: -42px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(139,61,255,.08);
    }

    .metric-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; z-index: 1; }
    .metric-label { color: var(--muted); font-size: 12px; font-weight: 850; text-transform: uppercase; letter-spacing: .06em; }
    .metric-value { font-size: 32px; letter-spacing: -.055em; font-weight: 950; margin: 12px 0 4px; z-index: 1; }
    .metric-help { color: var(--muted); font-size: 13px; font-weight: 650; z-index: 1; }

    .spark {
      height: 36px;
      display: flex;
      align-items: flex-end;
      gap: 4px;
      z-index: 1;
    }
    .spark span {
      width: 10px;
      border-radius: 999px 999px 3px 3px;
      background: linear-gradient(180deg, rgba(139,61,255,.7), rgba(139,61,255,.24));
      display: block;
    }

    .table-wrap { overflow-x: auto; border-radius: 18px; border: 1px solid var(--line); background: #fff; }
    table { width: 100%; border-collapse: collapse; min-width: 760px; }
    th, td { text-align: left; padding: 13px 14px; border-bottom: 1px solid #eee5da; vertical-align: top; }
    th { color: #6a5f55; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; background: #fbf7f2; font-weight: 900; }
    td { font-weight: 680; font-size: 14px; }
    tbody tr:hover { background: #fffaf4; }
    tr:last-child td { border-bottom: 0; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .muted { color: var(--muted); font-weight: 650; }

    .bar-list { display: grid; gap: 12px; }
    .bar-row { display: grid; gap: 7px; }
    .bar-row .bar-meta { display:flex; justify-content:space-between; gap: 10px; font-size: 13px; font-weight: 800; }
    .bar-track { height: 12px; border-radius: 999px; background: #efe8df; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--primary), #ff7ac8); }
    .bar-fill.mint { background: linear-gradient(90deg, var(--mint), #75d89d); }
    .bar-fill.amber { background: linear-gradient(90deg, #ffbc4b, #ff8b2b); }
    .bar-fill.blue { background: linear-gradient(90deg, var(--blue), #60c0ff); }

    .split-card {
      display: grid;
      grid-template-columns: 80px 1fr;
      gap: 14px;
      align-items: start;
    }
    .big-icon {
      width: 74px;
      height: 74px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      font-size: 30px;
      background: var(--primary-soft);
      border: 1px solid rgba(139,61,255,.18);
    }

    .feature-list { display: grid; gap: 10px; margin-top: 12px; }
    .feature-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 11px 12px;
      border-radius: 14px;
      background: rgba(255,255,255,.66);
      border: 1px solid var(--line);
      font-weight: 700;
      color: #3f362e;
      line-height: 1.35;
    }
    .check {
      width: 22px;
      height: 22px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--mint-soft);
      color: #08764e;
      font-size: 13px;
      font-weight: 950;
    }

    .pos-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .product-tile {
      min-height: 132px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 20px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 8px 22px rgba(58,44,34,.05);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .product-tile:hover { transform: translateY(-3px); box-shadow: 0 15px 32px rgba(58,44,34,.1); }
    .product-tile .emoji { font-size: 32px; }
    .product-tile b { font-size: 15px; letter-spacing: -.02em; line-height: 1.15; }
    .product-tile small { color: var(--muted); font-weight: 700; }

    .cart-panel { position: sticky; top: calc(var(--topbar) + 18px); }
    .cart-items { display: grid; gap: 10px; margin: 14px 0; }
    .cart-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 11px 12px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 15px;
    }
    .cart-item b { display:block; line-height: 1.16; }
    .cart-item small { color: var(--muted); font-weight: 650; }
    .cart-summary {
      background: #211912;
      color: #fff;
      border-radius: 18px;
      padding: 16px;
      margin-top: 14px;
    }
    .sum-row { display:flex; justify-content:space-between; gap: 10px; padding: 6px 0; color: rgba(255,255,255,.78); font-weight: 750; }
    .sum-row.total { color: #fff; font-size: 24px; font-weight: 950; border-top: 1px solid rgba(255,255,255,.18); margin-top: 8px; padding-top: 12px; }

    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .tab {
      border: 1px solid var(--line);
      background: #fff;
      padding: 9px 12px;
      border-radius: 999px;
      color: var(--muted);
      font-weight: 850;
      font-size: 13px;
    }
    .tab.active { background: var(--ink); color: #fff; border-color: var(--ink); }

    .invoice-card {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 20px;
      padding: 16px;
      display: grid;
      gap: 12px;
    }
    .invoice-top { display:flex; align-items:flex-start; justify-content:space-between; gap: 12px; }

    function renderUsuarios() {
      const roleLabel = state.role === 'global' ? 'Administrador global' : state.role === 'sucursal' ? 'Administrador sucursal' : 'Operador / cajera';
      return pageShell('Usuarios, roles y auditoría', 'Permisos separados por rol para proteger caja, facturación, inventario, contabilidad, configuración y acciones críticas como anulaciones o correcciones de cobro.', `
        <div class="grid sidebar-layout">
          <div class="panel"><h3>Permisos de la vista actual: ${roleLabel}</h3><div class="grid three">${permissions[state.role].map(p => `<div class="card flat"><h3>${p}</h3><p>Permiso habilitado para este rol en el mock.</p>${statusPill('Permitido')}</div>`).join('')}</div></div>
          <aside class="panel"><h3>Acciones con aprobación</h3><div class="feature-list"><div class="feature-item"><span class="check">✓</span><span>Anular factura o emitir nota de crédito.</span></div><div class="feature-item"><span class="check">✓</span><span>Corregir método de cobro después de cierre.</span></div><div class="feature-item"><span class="check">✓</span><span>Ajustar inventario o registrar merma extraordinaria.</span></div><div class="feature-item"><span class="check">✓</span><span>Cambiar precios, descuentos o lista comercial.</span></div></div></aside>

      `);

    function renderFase2() {
      return pageShell('Fase 2: restaurante, cafetería y cocina', 'El core del POS queda flexible para crecer después a restaurante: mesas, meseros, comandas, cocina, delivery avanzado, propinas y producción de platos.', `
        <div class="grid three">
          <div class="card split-card"><div class="big-icon">🍽️</div><div><h3>Mesas y salones</h3><p>Mapa de mesas, cuentas separadas, unión de mesas, reservas y cambio de mesero.</p></div></div>
          <div class="card split-card"><div class="big-icon">👨‍🍳</div><div><h3>KDS cocina</h3><p>Pantalla de cocina con tiempos, prioridades, estados y preparación por estación.</p></div></div>
          <div class="card split-card"><div class="big-icon">🧑‍🍳</div><div><h3>Meseros</h3><p>App móvil o web para tomar pedidos, enviarlos a cocina y cerrar cuenta.</p></div></div>
          <div class="card split-card"><div class="big-icon">🥘</div><div><h3>Recetas de platos</h3><p>El mismo motor de recetas maneja ingredientes, mermas y costo real de platos.</p></div></div>
          <div class="card split-card"><div class="big-icon">💵</div><div><h3>Propinas</h3><p>Distribución de propinas por mesero, turno, sucursal y forma de pago.</p></div></div>
          <div class="card split-card"><div class="big-icon">🛵</div><div><h3>Delivery avanzado</h3><p>Rutas, motoristas, tiempos, canales externos y conciliación de comisiones.</p></div></div>
        </div>
        <div class="panel mt-18"><h3>Decisión de arquitectura</h3><p>El MVP para heladerías debe construir bien el motor de venta, inventario, recetas, combos, fiscal, cobro y reportería. Así la fase restaurante no sería otro sistema: sería una extensión natural sobre la misma base transaccional.</p></div>
      `);
    }

    function renderImplementacion() {
      return pageShell('Implementación sugerida del MVP', 'Backlog visual para pasar de mock a producto: prioriza operación de heladería y deja restaurante como fase 2.', `
        <div class="kanban">
          <div class="kanban-col"><h3>Fase 0 · Diseño <span class="pill blue">Mock</span></h3><div class="kanban-card"><b>Demo navegable</b><small>Pantallas, flujo POS, módulos y reglas funcionales.</small></div><div class="kanban-card"><b>Validación cliente</b><small>Confirmar procesos reales de caja, inventario y facturación.</small></div></div>
          <div class="kanban-col"><h3>Fase 1 · MVP Heladería <span class="pill mint">Core</span></h3><div class="kanban-card"><b>POS + cobro + factura</b><small>Venta rápida, e-CF, turnos, caja y corrección de cobro.</small></div><div class="kanban-card"><b>Inventario + recetas</b><small>Consumo automático, combos, compras y kardex.</small></div></div>
          <div class="kanban-col"><h3>Fase 1.5 · Finanzas <span class="pill amber">Gestión</span></h3><div class="kanban-card"><b>Estado resultados</b><small>Ventas, costo, gastos, margen por sucursal y consolidado.</small></div><div class="kanban-card"><b>Reportería BI</b><small>Dashboard operativo y gerencial.</small></div></div>
          <div class="kanban-col"><h3>Fase 2 · Restaurante <span class="pill brown">Extensión</span></h3><div class="kanban-card"><b>Mesas + comandas</b><small>Meseros, cocina, salones, propinas y KDS.</small></div><div class="kanban-card"><b>Delivery avanzado</b><small>Pedidos, rutas, canales externos y conciliación.</small></div></div>
        </div>
        <div class="panel mt-18"><h3>Conectores backend previstos</h3><div class="matrix"><div class="matrix-item"><b>API transaccional</b><span>ventas, facturas, cobros, cierres, inventario y contabilidad.</span></div><div class="matrix-item"><b>Base de datos</b><span>RNC, sucursales, productos, recetas, kardex, documentos fiscales.</span></div><div class="matrix-item"><b>Agente local</b><span>impresora, caja, lector, Verifone y confirmaciones físicas.</span></div><div class="matrix-item"><b>Servicios externos</b><span>DGII/e-CF, adquirente de pagos, email/WhatsApp y BI.</span></div></div></div>
      `);
    }

    function renderFallbackModule(id) {
      const titles = {
        'compras':'Módulo de compras', 'contabilidad':'Contabilidad básica', 'estado-resultados':'Estado de resultados', 'bancos':'Bancos', 'pagos':'Pagos', 'dgii':'DGII', 'reporteria':'Reportería', 'usuarios':'Usuarios'
      };
      return pageShell(titles[id] || 'Módulo', 'Vista en construcción dentro del mock.', `<div class="panel"><p>Módulo reservado.</p></div>`);
    }

    const routeRenderers = {
      inicio: renderInicio,
      mapa: renderMapa,
      implementacion: renderImplementacion,
      pos: renderPOS,
      cierre: renderCierre,
      'correccion-cobro': renderCorreccionCobro,
      facturas: renderFacturas,
      clientes: renderClientes,
      sucursales: renderSucursales,
      precios: renderPrecios,
      delivery: renderDelivery,
      inventario: renderInventario,
      recetas: renderRecetas,
      produccion: renderProduccion,
      transferencias: renderTransferencias,
      compras: renderCompras,
      contabilidad: renderContabilidad,
      'estado-resultados': renderEstadoResultados,
      bancos: renderBancos,
      pagos: renderPagos,
      dgii: renderDGII,
      reporteria: renderReporteria,
      usuarios: renderUsuarios,
      fase2: renderFase2
    };

    function render() {
      renderNav();
      const app = document.getElementById('app');
      const renderer = routeRenderers[state.route] || (() => renderFallbackModule(state.route));
      app.innerHTML = renderer();
      document.getElementById('roleSelect').value = state.role;
      document.getElementById('branchBadge').textContent = state.role === 'global' ? 'Vista global' : state.role === 'sucursal' ? 'Sucursal: Naco' : 'Caja: Naco #01';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      wireDynamicActions();
    }

    function navigate(route) {
      state.route = route;
      location.hash = route;
      document.body.classList.remove('sidebar-open');
      render();
    }

    function wireDynamicActions() {
      document.querySelectorAll('[data-route]').forEach(el => {
        el.onclick = () => navigate(el.getAttribute('data-route'));
      });
      document.querySelectorAll('[data-toggle-section]').forEach(btn => {
        btn.onclick = () => btn.closest('.nav-section').classList.toggle('collapsed');
      });
      document.querySelectorAll('[data-add-product]').forEach(btn => {
        btn.onclick = () => {
          const name = btn.getAttribute('data-add-product');
          const price = Number(btn.getAttribute('data-price'));
          const type = name.includes('Combo') ? 'Combo' : ['Helado 1 bola','Helado 2 bolas','Batida premium'].includes(name) ? 'Receta' : 'Producto';
          state.cart.push({ name, type, qty: 1, price, stockRule: type === 'Receta' ? 'Consume ingredientes configurados' : type === 'Combo' ? 'Desagrupa productos del combo' : 'Descuenta SKU directo' });
          showToast(`${name} agregado. Inventario validado antes de cobrar.`);
          render();
        };
      });
      document.querySelectorAll('[data-remove-item]').forEach(btn => {
        btn.onclick = () => {
          state.cart.splice(Number(btn.getAttribute('data-remove-item')), 1);
          showToast('Producto removido del ticket.');
          render();
        };
      });
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => toast.classList.remove('show'), 3600);
    }

    function openModal(title, body) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalBody').innerHTML = body;
      document.getElementById('modalBackdrop').classList.add('show');
      document.getElementById('modalBackdrop').setAttribute('aria-hidden', 'false');
    }

    function closeModal() {
      document.getElementById('modalBackdrop').classList.remove('show');
      document.getElementById('modalBackdrop').setAttribute('aria-hidden', 'true');
    }

    document.addEventListener('click', (event) => {
      const actionEl = event.target.closest('[data-action]');
      if (!actionEl) return;
      const action = actionEl.getAttribute('data-action');
      if (action === 'simulate-payment') {
        state.deviceStatus = 'Conectado';
        openModal('Cobro con tarjeta autorizado', `<div class="print-ticket"><div class="ticket-row"><span>Dispositivo</span><b>Verifone local</b></div><div class="ticket-row"><span>Monto</span><b>${currency.format(1192)}</b></div><div class="ticket-row"><span>Autorización</span><b>APROB-893014</b></div><div class="ticket-row"><span>Lote</span><b>LOTE-77821</b></div><div class="ticket-row"><span>Acción siguiente</span><b>Emitir e-CF</b></div></div><p class="mt-14 muted">En producción este botón llamaría al agente local instalado en la PC de caja y esperaría confirmación del dispositivo físico.</p>`);
      }
      if (action === 'simulate-cash') showToast('Cobro en efectivo registrado. Se actualizó efectivo esperado del turno.');
      if (action === 'clear-cart') { state.cart = []; showToast('Ticket limpiado.'); render(); }
      if (action === 'hold-ticket') showToast('Venta pausada. Queda como ticket pendiente del turno.');
      if (action === 'print-ticket') openModal('Factura e-CF simulada', `<div class="print-ticket"><center><b>PUNTOFLEX 360</b><br>Sucursal Naco<br>RNC 1-00-00000-0<br>e-CF E31-00000489</center><br><div class="ticket-row"><span>Helado 2 bolas x2</span><b>${currency.format(360)}</b></div><div class="ticket-row"><span>Combo Familiar x1</span><b>${currency.format(650)}</b></div><div class="ticket-row"><span>ITBIS</span><b>${currency.format(182)}</b></div><div class="ticket-row"><span>TOTAL</span><b>${currency.format(1192)}</b></div><br><center>Estado DGII: Aceptado</center></div>`);
      if (action === 'save-payment-correction') { state.paymentCorrectionSaved = true; showToast('Corrección guardada: factura intacta, cobro reclasificado y asiento generado.'); render(); }
      if (action === 'preview-accounting') openModal('Asiento sugerido de corrección', `<div class="table-wrap"><table><thead><tr><th>Cuenta</th><th>Débito</th><th>Crédito</th></tr></thead><tbody><tr><td>Banco / Tarjetas por depositar</td><td class="num">${currency.format(740)}</td><td class="num">-</td></tr><tr><td>Caja efectivo</td><td class="num">-</td><td class="num">${currency.format(740)}</td></tr></tbody></table></div><p class="mt-14 muted">Documento DC-COBRO-00017 queda enlazado a E31-00000482 sin modificar la factura fiscal.</p>`);
      if (action === 'inventory-test') openModal('Venta bloqueada por inventario', `<p>El combo seleccionado requiere cucharas biodegradables. La sucursal Bávaro tiene 260 unidades y el mínimo configurado es 500. La regla ERP evita vender combos que generen consumo no permitido.</p><div class="feature-list"><div class="feature-item"><span class="check">✓</span><span>Opción 1: solicitar transferencia desde almacén central.</span></div><div class="feature-item"><span class="check">✓</span><span>Opción 2: autorizar sustitución de insumo.</span></div><div class="feature-item"><span class="check">✓</span><span>Opción 3: bloquear solo combos afectados, no toda la caja.</span></div></div>`);
      if (action === 'test-device') showToast('Prueba local enviada al Verifone. Autorización simulada recibida.');
      if (action === 'generate-paylink') openModal('Link de pago generado', `<div class="print-ticket"><div class="ticket-row"><span>Pedido</span><b>PED-1042</b></div><div class="ticket-row"><span>Monto</span><b>${currency.format(650)}</b></div><div class="ticket-row"><span>Referencia</span><b>PAY-360-1042</b></div><div class="ticket-row"><span>Estado</span><b>Esperando confirmación</b></div></div><p class="mt-14 muted">En producción se mostraría URL/QR del gateway y se confirmaría por webhook antes de cerrar cobro.</p>`);
      if (action === 'retry-dgii') showToast('Reintento DGII ejecutado. Documento enviado a cola de validación.');
      if (action === 'generate-dgii') showToast('Paquete fiscal preliminar 606/607/608 generado para revisión.');
      if (action === 'view-xml') openModal('XML e-CF simulado', `<pre style="white-space:pre-wrap;background:#211912;color:#fff;padding:16px;border-radius:16px;overflow:auto">&lt;eCF&gt;\n  &lt;Encabezado&gt;E31-00000481&lt;/Encabezado&gt;\n  &lt;Emisor&gt;PuntoFlex Demo&lt;/Emisor&gt;\n  &lt;Estado&gt;Aceptado DGII&lt;/Estado&gt;\n&lt;/eCF&gt;</pre>`);
      if (action === 'open-checklist') openModal('Checklist para pasar de mock a backend', `<div class="feature-list"><div class="feature-item"><span class="check">✓</span><span>Definir modelo de datos: empresa/RNC, sucursales, cajas, almacenes, usuarios.</span></div><div class="feature-item"><span class="check">✓</span><span>Construir POS transaccional con validación de inventario antes de cobro.</span></div><div class="feature-item"><span class="check">✓</span><span>Integrar e-CF/DGII y reportes 606/607/608.</span></div><div class="feature-item"><span class="check">✓</span><span>Crear motor de recetas, combos y kardex.</span></div><div class="feature-item"><span class="check">✓</span><span>Definir integración local con Verifone o gateway virtual.</span></div><div class="feature-item"><span class="check">✓</span><span>Crear estado de resultados por sucursal y consolidado.</span></div></div>`);
      if (['close-shift','new-client','new-recipe','new-po','export-pnl'].includes(action)) showToast('Acción simulada en el mock. Lista para conectar al backend.');
    });

    document.getElementById('roleSelect').addEventListener('change', (event) => {
      state.role = event.target.value;
      showToast(`Vista cambiada a ${event.target.options[event.target.selectedIndex].text}.`);
      render();
    });

    document.getElementById('mobileToggle').addEventListener('click', () => document.body.classList.add('sidebar-open'));
    document.getElementById('mobileOverlay').addEventListener('click', () => document.body.classList.remove('sidebar-open'));
    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('modalBackdrop').addEventListener('click', (event) => { if (event.target.id === 'modalBackdrop') closeModal(); });
    document.getElementById('globalSearch').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        const q = event.target.value.trim();
        if (!q) return;
        openModal('Búsqueda global simulada', `<p>Resultado para <b>${q}</b></p><div class="feature-list"><div class="feature-item"><span class="check">✓</span><span>Factura E31-00000482 encontrada en Piantini.</span></div><div class="feature-item"><span class="check">✓</span><span>Producto relacionado con receta y kardex.</span></div><div class="feature-item"><span class="check">✓</span><span>Disponible para auditoría, contabilidad y reportes.</span></div></div>`);
      }
    });

    function init() {
      const hash = location.hash.replace('#','');
      if (hash && routeRenderers[hash]) state.route = hash;
      render();
    }

    init();
  </script>
